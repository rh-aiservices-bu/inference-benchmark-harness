[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-benchmark-harness"
version = "0.1.0"
description = "Bounded AIPerf experiments with explicit evidence and recovery"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
runtime = ["aiperf==0.12.0"]

[project.scripts]
inference-bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["bench*"]
