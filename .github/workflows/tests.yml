name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: make test
  aiperf-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install '.[runtime]'
      - run: make test-integration
        env:
          TMPDIR: /tmp
      - run: make test-matrix
        env:
          TMPDIR: /tmp
  container-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make image
      - name: Prepare writable results for container UID
        run: |
          mkdir -p "$RUNNER_TEMP/harness-results"
          sudo chown 10001:10001 "$RUNNER_TEMP/harness-results"
      - run: make test-container TEST_ARTIFACTS="$RUNNER_TEMP/harness-results"
